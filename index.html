<!DOCTYPE html>
<html lang="ja">
  <head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATHLETA ACADEMY OKINAWA | アスレタアカデミー沖縄</title>
    <meta name="description" content="沖縄のサッカースクール、アスレタアカデミー沖縄。ブラジル式メソッドで子どもたちの技術と創造性を育てます。無料体験受付中。" />
    <meta property="og:title" content="ATHLETA ACADEMY OKINAWA" />
    <meta property="og:description" content="沖縄のサッカースクール、アスレタアカデミー沖縄。無料体験受付中。" />
    <meta property="og:url" content="https://www.athleta-academy-okinawa.com/" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7N7SHC55S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7N7SHC55S');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
<!-- 前回の言語選択クッキーをリセットし、常に日本語から開始させる -->
    <script type="text/javascript">
      function clearGoogTransCookie() {
        var domain = window.location.hostname;
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + domain;
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.' + domain;
      }
      clearGoogTransCookie();
    </script>

    <!-- 言語切替ボタン（サイトデザインに合わせたカスタムUI） -->
    <div style="position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; gap: 6px;">
      <button onclick="changeLanguage('ja')" style="padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.45); color: #F5C800; font-weight: bold; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px);">JP</button>
      <button onclick="changeLanguage('en')" style="padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.45); color: #ffffff; font-weight: bold; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px);">EN</button>
    </div>

    <!-- Google翻訳の実体（画面外に配置し、機能のみ利用） -->
    <div id="google_translate_element" style="position: absolute; top: -9999px; left: -9999px;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'ja', includedLanguages: 'en,ja', layout: google.translate.TranslateElement.InlineLayout.SIMPLE },
          'google_translate_element'
        );
      }
      function changeLanguage(lang) {
        if (lang === 'ja') {
          // 日本語へ戻す場合は、クッキーを削除してページを再読み込みするのが確実
          clearGoogTransCookie();
          window.location.reload();
          return;
        }
        var select = document.querySelector('#google_translate_element select.goog-te-combo');
        if (!select) {
          setTimeout(function () { changeLanguage(lang); }, 300);
          return;
        }
        select.value = lang;
        select.dispatchEvent(new Event('change'));
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Google翻訳の見た目（バナー・ツールチップ等）を完全非表示にし、レイアウトずれを防止 -->
    <style>
      body { top: 0px !important; position: static !important; }
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.skiptranslate,
      .goog-te-balloon-frame,
      #goog-gt-tt {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
      }
      .goog-te-gadget-icon { display: none !important; }
      .goog-tooltip, .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
    </style>
  </body>
</html>
